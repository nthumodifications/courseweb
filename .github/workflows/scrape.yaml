name: Nightly Course Sync

on:
  schedule:
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      semester:
        description: "Semester to sync; leave empty for automatic selection"
        required: false

# Jobs get a read-only token unless they ask for more below.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run course scraper
        working-directory: tools/data-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEMESTER: ${{ github.event.inputs.semester || '' }}
        run: bun run src/sync-courses.ts "$SEMESTER"
