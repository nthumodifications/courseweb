name: Build and Deploy Monorepo

on:
  workflow_dispatch:
    inputs:
      semester:
        description: "Semester to sync (e.g. 11510)"
        required: false
        default: "11510"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run course scraper
        working-directory: tools/data-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          SEMESTER: ${{ github.event.inputs.semester || '11510' }}
        run: bun run src/sync-courses.ts "$SEMESTER"
