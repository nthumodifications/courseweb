  run-scraper:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run course scraper
        working-directory: tools/data-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          SEMESTER: ${{ github.event.inputs.semester || '11510' }}
        run: bun run src/sync-courses.ts "$SEMESTER"

  build-and-push-data-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and tag Docker image for data-sync
      - name: Build Data Sync Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f tools/data-sync/Dockerfile . \
            -t "$IMAGE_NAME-data-sync:$IMAGE_TAG" \
            -t "$IMAGE_NAME-data-sync:latest"

      # Push Docker image to GHCR
      - name: Push Data Sync Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE_NAME-data-sync:$IMAGE_TAG"
          docker push "$IMAGE_NAME-data-sync:latest"

  build-and-push-secure-api:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Secure API Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f services/secure-api/Dockerfile . \
            -t "$IMAGE_NAME-secure-api:$IMAGE_TAG" \
            -t "$IMAGE_NAME-secure-api:latest"

      - name: Push Secure API Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE_NAME-secure-api:$IMAGE_TAG"
          docker push "$IMAGE_NAME-secure-api:latest"

      # This uuid is the Coolify app that actually serves auth.nthumods.com.
      # It used to point at a second app registered against the same image but
      # with no domain attached, so deploys succeeded against nothing and the
      # live server only moved when someone redeployed it by hand. Check the
      # target's fqdn before repointing this.
      - name: Trigger Coolify deployment
        if: success()
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --request GET "https://delta.nthumods.com/api/v1/deploy?uuid=nwwc8owkwo04c0owgc4kgkc8&force=false" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
