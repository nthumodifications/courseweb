name: Build and Deploy Monorepo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      semester:
        description: "Semester to sync (e.g. 11510)"
        required: false
        default: "11510"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Run tests for all services
      - name: Run tests
        run: |
          bun run test

      # Build all services
      - name: Build all services
        run: |
          bun run build

  check-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check that migration was generated for schema changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"

          SCHEMA_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- services/api/src/prisma/schema.prisma)
          if [ -z "$SCHEMA_CHANGED" ]; then
            echo "schema.prisma unchanged — no migration check needed."
            exit 0
          fi

          echo "schema.prisma changed. Verifying migration was generated..."

          PREVIOUS_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- services/api/src/prisma/schema.previous.prisma)
          if [ -z "$PREVIOUS_CHANGED" ]; then
            echo ""
            echo "ERROR: schema.prisma was changed but schema.previous.prisma was not updated."
            echo "Please run 'bun run prisma:migration:generate' in services/api and commit the result."
            exit 1
          fi

          NEW_MIGRATIONS=$(git diff --name-only "$BASE" "$HEAD" -- 'services/api/migrations/*.sql')
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo ""
            echo "ERROR: schema.prisma was changed but no new migration SQL file was found."
            echo "Please run 'bun run prisma:migration:generate' in services/api and commit the result."
            exit 1
          fi

          echo "Migration check passed. New migration(s):"
          echo "$NEW_MIGRATIONS"

  migrate-db:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    outputs:
      d1_access: ${{ steps.d1.outputs.access }}
    steps:
      # The deploy token has been rejected by D1 (Cloudflare error 7403) since
      # 2026-09-30. Until it is replaced, report that as one warning and skip
      # the migration and the API deploy, instead of failing every push to main.
      - name: Check the token can reach D1
        id: d1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/d1.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1")
          if [ "$status" = "200" ]; then
            echo "access=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "401" ] || [ "$status" = "403" ] || grep -q '"code": *7403' /tmp/d1.json; then
            echo "access=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=API not deployed::CLOUDFLARE_API_TOKEN cannot access D1 (HTTP $status). Migrations and the API deploy were skipped. Give the token D1 edit permission on this account, then re-run this workflow."
          else
            echo "Unexpected response from Cloudflare (HTTP $status)"
            cat /tmp/d1.json
            exit 1
          fi

      - name: Checkout code
        if: steps.d1.outputs.access == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        if: steps.d1.outputs.access == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.d1.outputs.access == 'true'
        run: bun install --frozen-lockfile

      - name: Apply D1 migrations
        if: steps.d1.outputs.access == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/api
          command: d1 migrations apply data-d1 --remote
          packageManager: bun

  deploy-api:
    runs-on: ubuntu-latest
    needs: [migrate-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.migrate-db.outputs.d1_access == 'true'
    environment: production
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate Prisma client for API service
      - name: Generate Prisma client
        run: |
          cd services/api
          bun run prisma:generate

      # Deploy API service to Cloudflare Workers
      - name: Deploy API Service
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/api
          command: deploy src/index.ts
          packageManager: bun

