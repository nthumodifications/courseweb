name: Build and Deploy Monorepo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      semester:
        description: "Semester to sync (e.g. 11510)"
        required: false
        default: "11510"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run design lint
        run: bun run design-lint

      - name: Test design-lint baseline comparison
        run: bun run test:design-lint

      # Run tests for all services
      - name: Run tests
        run: |
          bun run test

      # Keep the web app and its Cloudflare Worker entry type-safe.
      - name: Typecheck web
        working-directory: apps/web
        run: bun run type-check

      # Build all services
      - name: Build all services
        run: |
          bun run build

      - name: Setup Node for layout guard
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Layout guard
        working-directory: apps/web
        run: timeout 210s bun run layout-guard

      - name: Upload layout guard artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-guard-artifacts
          path: apps/web/layout-guard-artifacts
          if-no-files-found: ignore

  check-migrations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that migration was generated for schema changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"

          SCHEMA_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- services/api/src/prisma/schema.prisma)
          if [ -z "$SCHEMA_CHANGED" ]; then
            echo "schema.prisma unchanged — no migration check needed."
            exit 0
          fi

          echo "schema.prisma changed. Verifying migration was generated..."

          PREVIOUS_CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- services/api/src/prisma/schema.previous.prisma)
          if [ -z "$PREVIOUS_CHANGED" ]; then
            echo ""
            echo "ERROR: schema.prisma was changed but schema.previous.prisma was not updated."
            echo "Please run 'bun run prisma:migration:generate' in services/api and commit the result."
            exit 1
          fi

          NEW_MIGRATIONS=$(git diff --name-only "$BASE" "$HEAD" -- 'services/api/migrations/*.sql')
          if [ -z "$NEW_MIGRATIONS" ]; then
            echo ""
            echo "ERROR: schema.prisma was changed but no new migration SQL file was found."
            echo "Please run 'bun run prisma:migration:generate' in services/api and commit the result."
            exit 1
          fi

          echo "Migration check passed. New migration(s):"
          echo "$NEW_MIGRATIONS"

  migrate-db:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Check the token can reach D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/d1.json -w '%{http_code}'             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=1")
          if [ "$status" = "200" ]; then
            echo "D1 access check passed."
          elif [ "$status" = "401" ] || [ "$status" = "403" ] || grep -q '"code": *7403' /tmp/d1.json; then
            echo "::error title=API not deployed::CLOUDFLARE_API_TOKEN cannot access D1 (HTTP $status). Migrations and the API deploy were skipped. Give the token D1 edit permission on this account, then re-run this workflow."
            cat /tmp/d1.json
            exit 1
          else
            echo "Unexpected response from Cloudflare (HTTP $status)"
            cat /tmp/d1.json
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: services/api
          command: d1 migrations apply data-d1 --remote
          packageManager: bun

  deploy-api:
    runs-on: ubuntu-latest
    needs: [migrate-db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate Prisma client for API service
      - name: Generate Prisma client
        run: |
          cd services/api
          bun run prisma:generate

      # Deploy API service to Cloudflare Workers
      # `wrangler deploy` uploads the Worker (which puts the new code live) and
      # then syncs routes and cron triggers. A route or cron sync failure fails
      # the job even if the Worker code was uploaded.
      - name: Deploy API Service
        working-directory: services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          bunx wrangler deploy src/index.ts 2>&1 | tee /tmp/wrangler-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q 'Uploaded nthumods-api' /tmp/wrangler-deploy.log             && grep -q '/workers/routes) failed' /tmp/wrangler-deploy.log             && grep -q 'No access to the specified resource' /tmp/wrangler-deploy.log; then
            echo "::error title=API deployed, routes and crons not synced::The Worker code was uploaded, but CLOUDFLARE_API_TOKEN cannot read the zone's Workers routes, so changes to routes or cron triggers in wrangler.toml were not applied. Add Zone > Workers Routes > Edit to the token to clear this."
            exit "$status"
          fi
          exit "$status"

