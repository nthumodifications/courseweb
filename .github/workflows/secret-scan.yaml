name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary, not gitleaks-action: the action needs a paid
      # licence for organisation repositories.
      - name: Scan for secrets
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo             -e GIT_CONFIG_COUNT=1             -e GIT_CONFIG_KEY_0=safe.directory             -e GIT_CONFIG_VALUE_0=/repo             ghcr.io/gitleaks/gitleaks:v8.24.3             git --config .gitleaks.toml --redact --no-banner --log-opts="$range"
